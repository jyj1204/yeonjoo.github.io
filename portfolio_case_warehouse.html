<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DACON 스마트 창고 출고 지연 예측</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --case-bg: #f2f3f6;
      --case-border: #d9dee8;
      --case-text: #111827;
    }
    @keyframes caseFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    *, *::before, *::after {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      letter-spacing: 0 !important;
    }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--case-bg) !important;
      overflow-x: clip;
      overflow-y: visible;
    }
    body {
      color: var(--case-text);
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    p,
    li,
    div,
    span {
      word-break: keep-all;
    }
    #root,
    #root > div,
    main,
    section,
    footer {
      background: var(--case-bg) !important;
    }
    nav {
      background: rgba(242, 243, 246, 0.94) !important;
      border-color: var(--case-border) !important;
      animation: caseFadeUp 0.65s ease both;
    }
    h1, h2, h3, h4 {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      letter-spacing: -0.02em !important;
    }
    [style*="background: rgb(244, 245, 247)"],
    [style*="background: #F4F5F7"],
    [style*="background:#F4F5F7"],
    [style*="background: rgb(249, 250, 251)"] {
      background: var(--case-bg) !important;
    }
    .fu,
    .fu1,
    .fu2,
    .fu3,
    .fu4,
    .fu5 {
      animation-duration: 0.68s !important;
      animation-timing-function: ease !important;
    }
    nav > div {
      padding-right: 72px !important;
    }
    .case-section-tabs {
      position: sticky !important;
      top: 56px !important;
      z-index: 120 !important;
      background: rgba(242, 243, 246, 0.96) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
    }
    .case-section-tabs > div::-webkit-scrollbar {
      display: none;
    }
    section[id] {
      scroll-margin-top: 132px;
    }
    @media (max-width: 700px) {
      body {
        overflow-x: clip;
      }
      .case-section-tabs {
        top: 56px !important;
      }
      nav > div {
        padding-right: 54px !important;
        justify-content: flex-start !important;
      }
      nav > div > div:last-child {
        display: none !important;
      }
      section,
      footer {
        padding-left: 24px !important;
        padding-right: 24px !important;
      }
      h1 {
        font-size: 34px !important;
      }
      h2 {
        font-size: 27px !important;
      }
      [style*="grid-template-columns: repeat(5"],
      [style*="grid-template-columns: repeat(4"],
      [style*="grid-template-columns: repeat(3"],
      [style*="grid-template-columns: 1fr 1fr"],
      [style*="grid-template-columns: 220px 1fr"] {
        grid-template-columns: 1fr !important;
      }
      table {
        min-width: 520px;
      }
      table,
      pre {
        max-width: 100%;
        overflow-x: auto;
      }
      footer > div,
      [style*="justify-content: space-between"] {
        align-items: flex-start !important;
        flex-direction: column !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./assets/warehouse_portfolio.bundle.js?v=footer-buttons-20260623"></script>
  <script>
    (() => {
      const styleProjectFooterButtons = () => {
        const footer = document.querySelector("footer");
        if (!footer) return;

        const nextLabel = "\uB2E4\uC74C \uD504\uB85C\uC81D\uD2B8 \u2192";
        const previousLabel = "\u2190 \uC774\uC804 \uD504\uB85C\uC81D\uD2B8";
        const previousHref = "./portfolio_case_retailrocket.html";
        const nextHref = "./portfolio_case_instacart.html";

        const nextProject = footer.querySelector(`a[href="${nextHref}"]`);
        const links = nextProject?.parentElement || footer.firstElementChild?.lastElementChild;
        if (!links) return;

        const strayPreviousLinks = [...footer.querySelectorAll(`a[href="${previousHref}"]`)];
        let previous = strayPreviousLinks.find((link) => link.parentElement === links);
        strayPreviousLinks.forEach((link) => {
          if (link !== previous) link.remove();
        });

        links.style.display = "flex";
        links.style.gap = "8px";
        links.style.alignItems = "center";
        links.style.justifyContent = "flex-end";
        links.style.flexWrap = "wrap";

        const baseButtonStyle = [
          "display:inline-flex",
          "align-items:center",
          "justify-content:center",
          "height:38px",
          "padding:0 16px",
          "border-radius:7px",
          "font-size:13px",
          "font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif",
          "font-weight:700",
          "line-height:1",
          "text-decoration:none",
          "white-space:nowrap",
          "cursor:pointer",
          "transition:all 0.15s"
        ].join(";");

        if (nextProject) {
          if (nextProject.textContent.trim() !== nextLabel) nextProject.textContent = nextLabel;
          nextProject.style.cssText = [
            baseButtonStyle,
            "background:#2563eb",
            "color:#fff",
            "border:1px solid #2563eb"
          ].join(";");
        }

        if (!previous) {
          previous = document.createElement("a");
          previous.href = previousHref;
          links.prepend(previous);
        } else if (previous.parentElement === links && previous !== links.firstElementChild) {
          links.prepend(previous);
        }

        if (previous.textContent.trim() !== previousLabel) previous.textContent = previousLabel;
        previous.style.cssText = [
          baseButtonStyle,
          "background:#f8fafc",
          "color:#6b7280",
          "border:1px solid #d9dee8"
        ].join(";");
        previous.onmouseenter = () => {
          previous.style.borderColor = "#d1d5db";
          previous.style.color = "#111827";
          previous.style.background = "#fff";
        };
        previous.onmouseleave = () => {
          previous.style.borderColor = "#d9dee8";
          previous.style.color = "#6b7280";
          previous.style.background = "#f8fafc";
        };
      };

      const observer = new MutationObserver(styleProjectFooterButtons);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener("load", styleProjectFooterButtons);
      styleProjectFooterButtons();
    })();
  </script>
</body>
</html>
