<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DACON 스마트 창고 출고 지연 예측</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --case-bg: #f2f3f6;
      --case-border: #d9dee8;
      --case-text: #111827;
    }
    @keyframes caseFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    *, *::before, *::after {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      letter-spacing: 0 !important;
    }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--case-bg) !important;
      overflow-x: clip;
      overflow-y: visible;
    }
    body {
      color: var(--case-text);
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    p,
    li,
    div,
    span {
      word-break: keep-all;
    }
    #root,
    #root > div,
    main,
    section,
    footer {
      background: var(--case-bg) !important;
    }
    nav {
      background: rgba(242, 243, 246, 0.94) !important;
      border-color: var(--case-border) !important;
      animation: caseFadeUp 0.65s ease both;
    }
    h1, h2, h3, h4 {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      letter-spacing: -0.02em !important;
    }
    [style*="background: rgb(244, 245, 247)"],
    [style*="background: #F4F5F7"],
    [style*="background:#F4F5F7"],
    [style*="background: rgb(249, 250, 251)"] {
      background: var(--case-bg) !important;
    }
    .fu,
    .fu1,
    .fu2,
    .fu3,
    .fu4,
    .fu5 {
      animation-duration: 0.68s !important;
      animation-timing-function: ease !important;
    }
    nav > div {
      padding-right: 72px !important;
    }
    .case-section-tabs {
      position: sticky !important;
      top: 56px !important;
      z-index: 120 !important;
      background: rgba(242, 243, 246, 0.96) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
    }
    .case-section-tabs > div::-webkit-scrollbar {
      display: none;
    }
    section[id] {
      scroll-margin-top: 132px;
    }
    @media (max-width: 700px) {
      body {
        overflow-x: clip;
      }
      .case-section-tabs {
        top: 56px !important;
      }
      nav > div {
        padding-right: 54px !important;
        justify-content: flex-start !important;
      }
      nav > div > div:last-child {
        display: none !important;
      }
      section,
      footer {
        padding-left: 24px !important;
        padding-right: 24px !important;
      }
      h1 {
        font-size: 34px !important;
      }
      h2 {
        font-size: 27px !important;
      }
      [style*="grid-template-columns: repeat(5"],
      [style*="grid-template-columns: repeat(4"],
      [style*="grid-template-columns: repeat(3"],
      [style*="grid-template-columns: 1fr 1fr"],
      [style*="grid-template-columns: 220px 1fr"] {
        grid-template-columns: 1fr !important;
      }
      table {
        min-width: 520px;
      }
      table,
      pre {
        max-width: 100%;
        overflow-x: auto;
      }
      footer > div,
      [style*="justify-content: space-between"] {
        align-items: flex-start !important;
        flex-direction: column !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./assets/warehouse_portfolio.bundle.js?v=case-copy-nav-20260531"></script>
  <script>
    (() => {
      const addPreviousProjectLink = () => {
        const footer = document.querySelector("footer");
        if (!footer || footer.querySelector('a[href="./portfolio_case_retailrocket.html"]')) return;
        const links = footer.querySelector("div > div:last-child");
        if (!links) return;

        const previous = document.createElement("a");
        previous.href = "./portfolio_case_retailrocket.html";
        previous.textContent = "← 이전 프로젝트";
        previous.style.cssText = [
          "padding:8px 16px",
          "border-radius:7px",
          "font-size:12px",
          "background:transparent",
          "color:#6b7280",
          "border:1px solid #d9dee8",
          "cursor:pointer",
          "font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif",
          "font-weight:600",
          "text-decoration:none",
          "transition:all 0.15s"
        ].join(";");
        previous.addEventListener("mouseenter", () => {
          previous.style.borderColor = "#d1d5db";
          previous.style.color = "#111827";
        });
        previous.addEventListener("mouseleave", () => {
          previous.style.borderColor = "#d9dee8";
          previous.style.color = "#6b7280";
        });
        links.prepend(previous);
      };

      const observer = new MutationObserver(addPreviousProjectLink);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener("load", addPreviousProjectLink);
      addPreviousProjectLink();
    })();
  </script>
</body>
</html>
