name: Deploy static portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive static site
        run: |
          tar \
            --dereference --hard-dereference \
            --directory . \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail

          oidc_json=$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")
          oidc_token=$(printf '%s' "$oidc_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          payload=$(jq -n \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg oidc "$oidc_token" \
            '{artifact_id:$artifact_id, pages_build_version:$sha, oidc_token:$oidc}')

          response=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments" \
            -d "$payload")
          if printf '%s' "$response" | jq -e '.message?' >/dev/null; then
            printf '%s\n' "$response"
            exit 1
          fi

          deployment_id=$(printf '%s' "$response" | jq -r '.id // (.status_url | split("/")[-1])')
          echo "Created Pages deployment: ${deployment_id}"

          for attempt in $(seq 1 120); do
            status_response=$(curl -sSf \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}")
            status=$(printf '%s' "$status_response" | jq -r '.status')
            echo "Pages status: ${status}"
            if [ "$status" = "succeed" ]; then
              exit 0
            fi
            case "$status" in
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                printf '%s\n' "$status_response"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for Pages deployment"
          exit 1
