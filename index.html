<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전연주 | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f8fb;
      color: #171a22;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    main {
      width: min(720px, calc(100% - 40px));
      padding: 56px 0;
    }

    p {
      margin: 0 0 12px;
      color: #5d6472;
      font-size: 16px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 9vw, 88px);
      line-height: 0.98;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <p>Data Analyst Portfolio</p>
    <h1>전연주</h1>
  </main>
</body>
</html>
