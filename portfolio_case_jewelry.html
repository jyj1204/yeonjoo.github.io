<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쥬얼리 브랜드 R사 타겟 리포지셔닝과 광고 예산 최적화</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --case-bg: #f2f3f6;
      --case-border: #d9dee8;
      --case-text: #111827;
    }
    *, *::before, *::after {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      letter-spacing: 0 !important;
    }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--case-bg) !important;
      overflow-x: hidden;
    }
    body {
      color: var(--case-text);
    }
    #root,
    #root > div,
    main,
    section,
    footer {
      background: var(--case-bg) !important;
    }
    nav {
      background: rgba(242, 243, 246, 0.94) !important;
      border-color: var(--case-border) !important;
    }
    h1, h2, h3, h4 {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      letter-spacing: -0.02em !important;
    }
    [style*="background: rgb(244, 245, 247)"],
    [style*="background: #F4F5F7"],
    [style*="background:#F4F5F7"],
    [style*="background: rgb(249, 250, 251)"] {
      background: var(--case-bg) !important;
    }
    nav > div {
      padding-right: 72px !important;
    }
    @media (max-width: 700px) {
      body {
        overflow-x: hidden;
      }
      nav > div {
        padding-right: 54px !important;
        justify-content: flex-start !important;
      }
      nav > div > div:last-child {
        display: none !important;
      }
      section,
      footer {
        padding-left: 24px !important;
        padding-right: 24px !important;
      }
      h1 {
        font-size: 34px !important;
      }
      h2 {
        font-size: 27px !important;
      }
      [style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
      }
      svg,
      .recharts-wrapper,
      .recharts-surface {
        max-width: 100% !important;
      }
      table {
        min-width: 520px;
      }
      table,
      pre {
        max-width: 100%;
        overflow-x: auto;
      }
      footer > div,
      [style*="justify-content: space-between"] {
        align-items: flex-start !important;
        flex-direction: column !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./assets/jewelry_portfolio.bundle.js"></script>
</body>
</html>
